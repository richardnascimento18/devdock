name: CI
on:
  pull_request:
    branches: [staging, production]
  push:
    branches: [staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  production-source:
    name: Production source validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require same-repository staging promotion
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-production-source.sh
  policy:
    name: Promotion policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release version and production source
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/version.py "$(cat VERSION)"
          if [[ "$BASE_REF" == production ]]; then
            old_version=$(git show "$BASE_SHA:VERSION")
            python3 scripts/version.py --after "$old_version" "$(cat VERSION)"
          fi
  checks:
    uses: ./.github/workflows/verify.yml
  required:
    name: Required validation
    if: always()
    needs: [policy, production-source, checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          POLICY: ${{ needs.policy.result }}
          CHECKS: ${{ needs.checks.result }}
          SOURCE: ${{ needs.production-source.result }}
        run: test "$POLICY" = success && test "$SOURCE" = success && test "$CHECKS" = success
